apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Stand-in image until the real API exists; swap via overlay images: block.
        # Port 8080 matches the real services in the app repo, so the swap is
        # image-only.
        - name: api
          image: traefik/whoami:v1.10
          ports:
            - name: http
              containerPort: 8080
          env:
            # Port via env, not args: the real image's CMD must survive (k8s
            # args would replace it). PORT drives the FastAPI image,
            # WHOAMI_PORT_NUMBER the stand-in; each ignores the other's.
            - name: PORT
              value: "8080"
            - name: WHOAMI_PORT_NUMBER
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm:4317
            - name: OTEL_SERVICE_NAME
              value: api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 25m
              # Sized for the real service (FastAPI + SQLAlchemy + OTel SDK),
              # not the stand-in — 128Mi OOMKill-loops it.
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
