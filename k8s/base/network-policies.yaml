# Portable K8s API. Enforced by Dataplane V2 on GKE; kind's default CNI does
# not enforce NetworkPolicy — install Cilium/Calico locally if you want to test it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
---
# Envoy Gateway runs its data plane in `envoy-gateway-system` by default, so the
# Gateway reaches these pods across namespaces. (`kubernetes.io/metadata.name` is
# set automatically by the apiserver on every namespace.) If the data plane is
# ever moved into this namespace, `allow-same-namespace` above already covers it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-dataplane
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["api", "mcp-server", "otel-lgtm", "minio"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
