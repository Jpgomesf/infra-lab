apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      containers:
        # Stand-in image; the real MCP server must speak streamable HTTP and
        # target spec >= 2026-07-28 (stateless) so any replica can serve any request.
        - name: mcp-server
          image: traefik/whoami:v1.10
          ports:
            - name: http
              containerPort: 80
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm:4317
            - name: OTEL_SERVICE_NAME
              value: mcp-server
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
