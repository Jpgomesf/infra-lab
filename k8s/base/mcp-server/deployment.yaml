apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Stand-in image; the real MCP server must speak streamable HTTP and
        # target spec >= 2026-07-28 (stateless) so any replica can serve any request.
        # Port 8080 matches the real service in the app repo, so the swap is
        # image-only.
        - name: mcp-server
          image: traefik/whoami:v1.10
          ports:
            - name: http
              containerPort: 8080
          env:
            # Port via env, not args — same contract as the api Deployment.
            - name: PORT
              value: "8080"
            - name: WHOAMI_PORT_NUMBER
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-lgtm:4317
            - name: OTEL_SERVICE_NAME
              value: mcp-server
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
