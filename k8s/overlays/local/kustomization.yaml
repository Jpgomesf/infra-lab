apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no top-level `namespace:` — the base already places its own
# resources in `app`, and a namespace transformer here would also stamp
# `metadata.namespace` onto the cluster-scoped GatewayClass (kustomize only
# knows the scope of built-in kinds, not of CRDs). Everything this overlay adds
# therefore declares its namespace explicitly instead.

resources:
  - ../../base
  - gateway.yaml

generatorOptions:
  disableNameSuffixHash: true

# Local-only throwaway credentials. Cloud overlays get these from
# Secret Manager via External Secrets Operator instead.
secretGenerator:
  - name: postgres-credentials
    namespace: app
    literals:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=localdev
      - POSTGRES_DB=app
      - url=postgres://app:localdev@postgres:5432/app
  - name: minio-credentials
    namespace: app
    literals:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin-local
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin-local
