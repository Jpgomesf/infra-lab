name: tofu-plan

# PR-time checks for the IaC layer.
#
#   validate      - offline; no backend, no credentials. Always runs.
#   trivy-config  - offline misconfiguration scan of infra/. Always runs.
#   plan          - talks to GCP; skipped until the repo variables WIF_PROVIDER
#                   and WIF_SERVICE_ACCOUNT exist (see README, "CI").
#
# The first two keep this workflow green before any GCP project exists.

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/tofu-plan.yml

permissions:
  contents: read

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TOFU_VERSION: 1.12.3

jobs:
  validate:
    name: validate (${{ matrix.env }}/${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # An explicit include list rather than a cross product: the stack names
      # are not the same in every env (gke vs eks), so env x stack would ask for
      # dev/eks and aws-dev/gke, neither of which exists.
      matrix:
        include:
          - { env: dev, stack: network }
          - { env: dev, stack: gke }
          - { env: dev, stack: data }
          - { env: dev, stack: platform }
          - { env: prod, stack: network }
          - { env: prod, stack: gke }
          - { env: prod, stack: data }
          - { env: prod, stack: platform }
          - { env: aws-dev, stack: network }
          - { env: aws-dev, stack: eks }
          - { env: aws-dev, stack: data }
          - { env: aws-dev, stack: platform }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # -backend=false skips the GCS backend entirely: no bucket, no
      # credentials, no state. Providers and modules are still resolved.
      - name: tofu init
        working-directory: infra/envs/${{ matrix.env }}/${{ matrix.stack }}
        run: tofu init -backend=false -input=false

      - name: tofu validate
        working-directory: infra/envs/${{ matrix.env }}/${{ matrix.stack }}
        run: tofu validate -no-color

  trivy-config:
    name: trivy config scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Accepted findings live in .trivyignore.yaml with a written rationale;
      # anything new at HIGH/CRITICAL fails the PR.
      - name: Scan infra/ for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          hide-progress: "true"

  plan:
    name: plan (${{ matrix.stack }})
    needs: [validate]
    # Pre-bootstrap guard: no WIF provider configured means no GCP project to
    # plan against, so the job is skipped rather than failed.
    # NOTE: plan/apply target envs/dev only until the prod project exists —
    # arming prod means a second WIF provider + project variables and a prod
    # dimension here, mirroring the validate matrix.
    # NOTE: arming aws-dev additionally needs aws-actions/configure-aws-credentials
    # (GitHub OIDC role in the AWS account) guarded by an AWS_ROLE_ARN variable,
    # alongside the google auth step — the GCS backend needs both. Later.
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
      pull-requests: write # post the plan as a PR comment
    strategy:
      fail-fast: false
      matrix:
        stack: [network, gke, data, platform]
    # Only variables that have no usable default are wired here: an unset repo
    # variable expands to "", and TF_VAR_x="" overrides a default rather than
    # falling back to it. `region` keeps its us-central1 default in variables.tf.
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_billing_account_id: ${{ secrets.BILLING_ACCOUNT_ID }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu init
        working-directory: infra/envs/dev/${{ matrix.stack }}
        run: tofu init -input=false

      # -lock=false: a plan only reads state, and PR plans should not queue
      # behind each other or behind an apply.
      - name: tofu plan
        id: plan
        continue-on-error: true
        shell: bash
        working-directory: infra/envs/dev/${{ matrix.stack }}
        run: tofu plan -input=false -no-color -lock=false 2>&1 | tee plan.txt

      - name: Comment plan on the PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STACK: ${{ matrix.stack }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            const outcome = process.env.PLAN_OUTCOME;
            const marker = `<!-- tofu-plan:${stack} -->`;
            const file = `infra/envs/dev/${stack}/plan.txt`;

            let plan = fs.existsSync(file)
              ? fs.readFileSync(file, 'utf8')
              : '(no plan output was produced)';

            // GitHub caps a comment at 65536 characters; leave room for the
            // wrapper markup.
            const LIMIT = 55000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n... truncated; see the job log for the full plan ...';
            }

            const status = outcome === 'success' ? 'succeeded' : 'FAILED';
            const body = [
              marker,
              `### tofu plan — \`${stack}\` (${status})`,
              '',
              '<details><summary>show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The plan step is continue-on-error only so the comment above always
      # gets posted; a failed plan must still fail the check.
      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
