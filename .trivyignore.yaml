# Accepted findings for `trivy config` (see .github/workflows/tofu-plan.yml).
#
# This file is the accepted-risk register for the IaC scan, not a mute button:
# every entry needs a reason, and anything not listed here still fails the PR
# at HIGH/CRITICAL. Re-check these whenever the relevant module changes.
misconfigurations:
  - id: AVD-GCP-0048
    statement: >-
      Legacy metadata endpoints. Both node pools set
      workload_metadata_config.mode = GKE_METADATA, which is Workload Identity
      and blocks the legacy endpoints; GKE has also disabled them by default
      since 1.12. The check only looks for an explicit
      metadata.disable-legacy-endpoints entry, which the provider sets for us.

  - id: AVD-GCP-0061
    statement: >-
      Master authorized networks. The gke module does support them
      (var.authorized_networks drives a dynamic
      master_authorized_networks_config block), but the CIDR list is a personal
      IP that must not be committed, so the default is empty and the scanner
      sees an unconfigured cluster. Revisit once dev has a stable egress IP or
      a bastion, and enable the block unconditionally then.

  - id: AVD-AWS-0039
    statement: >-
      "Cluster does not have secret encryption enabled." False, not accepted.
      Amazon EKS envelope-encrypts all Kubernetes API data with an AWS-owned key
      on every cluster running 1.28 or later — free, automatic, and per AWS's own
      documentation requiring no action or permissions from the operator
      (https://docs.aws.amazon.com/eks/latest/userguide/envelope-encryption.html).
      The check only looks for an explicit encryption_config block, which a
      scanner reading HCL cannot distinguish from a platform default; this is the
      same class of finding as AVD-GCP-0048 above. The eks module does support a
      customer-managed key (enable_secrets_encryption = true, with the key policy
      the cluster role needs), and it is off by default because a CMK buys key
      ownership rather than encryption while adding a failure mode AWS describes
      as degrading the cluster "beyond recovery" if the key is ever deleted —
      a poor trade in an apply-then-destroy lab. Revisit if an audit requirement
      ever needs the CloudTrail record of key use.

  - id: AVD-AWS-0040
    statement: >-
      Public EKS control-plane endpoint. This is the AWS twin of AVD-GCP-0061
      above, and it is accepted for the same reason: the eks module deliberately
      mirrors the gke module's posture (private nodes, public API endpoint
      restricted by var.authorized_networks), and the only CIDR that belongs in
      that list is a personal IP that must not be committed. The module does
      support closing the endpoint entirely — set enable_public_endpoint =
      false — but that leaves the cluster unreachable without a bastion or VPN,
      which a laptop-driven lab cannot absorb. The check fires on
      endpoint_public_access = true regardless of the CIDR restriction, so
      narrowing the list would not clear it. Retire this entry together with
      AVD-GCP-0061 once there is a bastion or a stable egress IP.
