kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  # Host 80 -> the Envoy data plane's fixed NodePort 30080, pinned by the
  # EnvoyProxy resource in k8s/overlays/local/gateway.yaml. NodePorts listen on
  # every node, so publishing them from the control-plane node is fine even
  # though Envoy itself schedules on the worker.
  #
  # 443 -> 30443 is reserved: the lab Gateway has no HTTPS listener yet (no local
  # TLS cert), so nothing answers there until one is added. Mapping it now means
  # adding TLS later needs no cluster recreate.
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  - role: worker
